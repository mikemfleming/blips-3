<!doctype html><meta charset="utf-8"><title>Blips audio regression</title><pre id="results">Rendering audio tests…</pre><script type="module">
import {AudioEngine,createAudioGraph,STEREO_WIDTH} from '../src/audio.js';
window.audioTests=(async()=>{
 const results=[];
 for(const mode of ['trigger','swell'])for(const peak of [1,256]){
  const ctx=new OfflineAudioContext(2,48000*4,48000),engine=new AudioEngine();
  engine.ctx=ctx;Object.assign(engine,createAudioGraph(ctx));engine.mode=mode;engine.peak=peak;engine.bpm=240;
  engine.density.fill(256);
  for(let i=0;i<56;i++){
   if(i>=24)for(let row=0;row<32;row++)engine.density[row*32+i%32]=i%2?0:256;
   engine.scheduleStep(.04+i*.0625,i%32);
  }
  const buffer=await ctx.startRendering();let max=0,clipped=0,delta=0;
  for(let channel=0;channel<2;channel++){
   const samples=buffer.getChannelData(channel);
   for(let i=0;i<samples.length;i++){
    max=Math.max(max,Math.abs(samples[i]));
    if(!Number.isFinite(samples[i])||Math.abs(samples[i])>=1)clipped++;
    if(i)delta=Math.max(delta,Math.abs(samples[i]-samples[i-1]));
   }
  }
  if(clipped||max>=.8||delta>=.1)throw Error(JSON.stringify({mode,peak,max,clipped,delta}));
  results.push({mode,threshold:peak,stereoWidth:STEREO_WIDTH,peak:max,clipped,maxSampleChange:delta});
 }
 const ctx=new OfflineAudioContext(2,48000*2,48000),engine=new AudioEngine();
 engine.ctx=ctx;Object.assign(engine,createAudioGraph(ctx));engine.mode='swell';engine.density.fill(256);
 engine.scheduleStep(.04,0);engine.scheduleStep(1.04,31);
 const buffer=await ctx.startRendering();
 const rms=(channel,start,end)=>{
  const samples=buffer.getChannelData(channel);let sum=0;
  for(let i=start*48000;i<end*48000;i++)sum+=samples[i]**2;
  return Math.sqrt(sum/((end-start)*48000));
 };
 const leftStart=rms(0,.3,.8),rightStart=rms(1,.3,.8),leftEnd=rms(0,1.3,1.8),rightEnd=rms(1,1.3,1.8);
 if(leftStart<=rightStart||rightEnd<=leftEnd)throw Error(JSON.stringify({leftStart,rightStart,leftEnd,rightEnd}));
 results.push({spatialScan:{leftStart,rightStart,leftEnd,rightEnd}});
 document.getElementById('results').textContent=JSON.stringify(results,null,2);return results;
})();
</script>
